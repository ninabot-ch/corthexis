# CortHeXis — CI on the Ninabot forge (light standard: docs/infra/cicd-plan.md §P7 of ninabot-pro).
# The forge runs lint + the unit tests; the tests against Postgres and the docker compose smoke
# run on the public mirror (.github/workflows/ci.yml), where outside contributors open their PRs.
name: ci
on:
  push:
  pull_request:
jobs:
  lint-tests:
    runs-on: python   # Python 3.12, no node: clone by hand (same setup as the other forge repos)
    steps:
      - name: Clone
        run: |
          git clone -q --depth 20 --branch "${{ github.head_ref || github.ref_name }}" "http://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@100.124.110.23:3003/${{ github.repository }}.git" . && git checkout -q "${{ github.sha }}"
          git log -1 --format='%h %s' | cut -c1-90
      - name: Files
        run: |
          ! git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- . ':!*.md' || { echo 'conflict markers'; exit 1; }
          n=$(git ls-files '*.sh' | wc -l); [ "$n" = 0 ] || { git ls-files -z '*.sh' | xargs -0 -n1 bash -n && echo "shell: $n file(s) ok"; }
          python3 -m pip install -q --disable-pip-version-check pyyaml >/dev/null
          git ls-files -z '*.yml' '*.yaml' | xargs -0 -r python3 -c 'import sys,yaml; [list(yaml.safe_load_all(open(f))) for f in sys.argv[1:]]; print("yaml:", len(sys.argv)-1, "file(s) ok")'
          git ls-files -z '*.json' | xargs -0 -r python3 -c 'import sys,json; [json.load(open(f)) for f in sys.argv[1:]]; print("json:", len(sys.argv)-1, "file(s) ok")'
      - name: ruff + pytest
        run: |
          python3 -m pip install -q --disable-pip-version-check -e ".[dev]" >/dev/null
          ruff check corthexis tests
          python3 -m pytest -q
